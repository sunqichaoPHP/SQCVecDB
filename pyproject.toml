[project]
name = "SQCVecDB"
version = "1.0.0"
description = "轻量级向量数据库，为 RAG 和语义搜索优化"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{name = "SQC"}]
keywords = ["vector-database", "rag", "embedding", "semantic-search", "ann"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "httpx>=0.24",
]
service = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
]
cluster = [
    "requests>=2.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
